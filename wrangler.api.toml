# the tv relay api, a nitro worker. deploy with `pnpm run deploy:api`, which
# points wrangler at this file (the site's config is wrangler.toml)
name = "pitmaster-api"
main = ".output/server/index.mjs"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# it answers at api.pitmaster.cc (cloudflare makes the dns record on the first
# deploy; pitmaster.cc has to be a zone on the same account). the site finds it
# through VITE_API_URL in .env.production
routes = [{ pattern = "api.pitmaster.cc", custom_domain = true }]
workers_dev = false

# live tv sync: the encrypted tv snapshots (an id, not a secret). a fresh
# account makes its own with
#   pnpm exec wrangler kv namespace create LIVE -c wrangler.api.toml
# and puts that id here.
[[kv_namespaces]]
binding = "LIVE"
id = "f5ff8e6ed4044521b90aa00755d2c9b3"

# live screens' websockets: one durable object (nitro's cloudflare-durable
# preset names it $DurableObject) holds every tv's and phone's socket, so a
# snapshot or a phone's mailbox is pushed the moment it arrives. sqlite-backed,
# which the free plan needs; it keeps nothing of its own (kv does that).
[[durable_objects.bindings]]
name = "$DurableObject"
class_name = "$DurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["$DurableObject"]
